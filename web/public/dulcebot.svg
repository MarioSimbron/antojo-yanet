<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DulceBot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#6b2d0b"/>
    </linearGradient>
  </defs>

  <!-- ── Antena ── -->
  <line x1="50" y1="18" x2="50" y2="6" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="4" r="4.5" fill="#fbbf24"/>

  <!-- ── Cabeza ── -->
  <rect x="18" y="18" width="64" height="52" rx="14" fill="url(#bg)"/>

  <!-- Ojo izquierdo (pantalla) -->
  <rect x="26" y="30" width="20" height="16" rx="5" fill="#fef3c7"/>
  <circle cx="36" cy="38" r="5" fill="#b45309"/>
  <circle cx="38" cy="36" r="1.8" fill="white"/>

  <!-- Ojo derecho (pantalla) -->
  <rect x="54" y="30" width="20" height="16" rx="5" fill="#fef3c7"/>
  <circle cx="64" cy="38" r="5" fill="#b45309"/>
  <circle cx="66" cy="36" r="1.8" fill="white"/>

  <!-- Boca (sonrisa) -->
  <path d="M34 56 Q50 66 66 56" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ── Cuerpo ── -->
  <rect x="26" y="72" width="48" height="24" rx="10" fill="url(#body)"/>

  <!-- Detalle: línea de pan / botón central -->
  <circle cx="50" cy="84" r="5" fill="#fbbf24"/>
  <circle cx="50" cy="84" r="2.5" fill="#b45309"/>

  <!-- Detalle: costados del cuerpo -->
  <rect x="16" y="76" width="8" height="14" rx="4" fill="#92400e"/>
  <rect x="76" y="76" width="8" height="14" rx="4" fill="#92400e"/>
</svg>
