<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DulceBot logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Hair — back mass (dark, very wavy) -->
  <ellipse cx="50" cy="26" rx="25" ry="21" fill="#1a0800" clip-path="url(#circle)"/>

  <!-- Left hair flowing down with waves -->
  <path d="M25 34 C17 50 16 66 20 80 C22 88 19 95 21 100 L29 100 C25 94 28 86 26 78 C22 65 23 50 31 36Z"
        fill="#1a0800" clip-path="url(#circle)"/>
  <!-- Left hair extra wave -->
  <path d="M19 60 C14 70 16 82 20 90 L24 90 C20 82 18 70 22 62Z"
        fill="#1a0800" clip-path="url(#circle)"/>

  <!-- Right hair flowing down with waves -->
  <path d="M75 34 C83 50 84 66 80 80 C78 88 81 95 79 100 L71 100 C75 94 72 86 74 78 C78 65 77 50 69 36Z"
        fill="#1a0800" clip-path="url(#circle)"/>
  <!-- Right hair extra wave -->
  <path d="M81 60 C86 70 84 82 80 90 L76 90 C80 82 82 70 78 62Z"
        fill="#1a0800" clip-path="url(#circle)"/>

  <!-- Face / skin tone -->
  <ellipse cx="50" cy="44" rx="17" ry="19" fill="#fde68a"/>

  <!-- Eyebrows (subtle arched) -->
  <path d="M40 37 Q44 35 47 37" stroke="#2d1200" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M53 37 Q56 35 60 37" stroke="#2d1200" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="43.5" cy="41" rx="2.3" ry="2.8" fill="#1a0800"/>
  <ellipse cx="56.5" cy="41" rx="2.3" ry="2.8" fill="#1a0800"/>
  <!-- Eye shine -->
  <circle cx="44.5" cy="40" r="0.8" fill="white"/>
  <circle cx="57.5" cy="40" r="0.8" fill="white"/>

  <!-- Nose (very subtle) -->
  <path d="M49 47 Q50 49 51 47" stroke="#d97706" stroke-width="0.7" fill="none" stroke-linecap="round"/>

  <!-- Lips -->
  <path d="M44 52 Q47 50 50 51 Q53 50 56 52 Q53 57 50 57 Q47 57 44 52Z" fill="#c2410c"/>
  <!-- Lip highlight -->
  <path d="M47 51.5 Q50 50.5 53 51.5" stroke="rgba(255,200,180,0.5)" stroke-width="0.7" fill="none"/>

  <!-- Neck -->
  <rect x="45.5" y="62" width="9" height="5" rx="2" fill="#fde68a"/>

  <!-- Choker necklace (thin black band + small gold bead) -->
  <path d="M37 65 Q50 67.5 63 65" stroke="#1a0800" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="66" r="2" fill="#f59e0b"/>

  <!-- Jacket / shoulders (dark) -->
  <path d="M0 100 Q20 72 37 67 Q50 70 63 67 Q80 72 100 100Z"
        fill="#1a0800" clip-path="url(#circle)"/>

  <!-- Small star sparkle — top right accent -->
  <path d="M77 14 L78.2 18 L82.5 18.3 L79.5 21 L80.5 25.3 L77 23 L73.5 25.3 L74.5 21 L71.5 18.3 L75.8 18Z"
        fill="white" opacity="0.88"/>
</svg>
